<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Linktal Outreach</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Linktal Outreach</h1>
      <p class="sub">Connect + Message · Qwen2.5 VL 72B (OpenRouter)</p>
    </header>

    <section class="card">
      <label>Backend URL</label>
      <input id="backendUrl" type="text" />
      <label>Soft-cap email</label>
      <input id="softCapEmail" type="email" />
      <div class="row">
        <label><input id="pauseAfterEmailGate" type="checkbox" /> Pause 48h after email gate</label>
      </div>
      <div class="row">
        <label><input id="fastDogfood" type="checkbox" /> Fast dogfood delays (short waits)</label>
      </div>
      <button id="saveSettings" class="secondary">Save settings</button>
      <p id="health" class="meta"></p>
    </section>

    <section class="card">
      <label>Job mode</label>
      <select id="jobMode">
        <option value="connect">Connect</option>
        <option value="message">Message</option>
      </select>
      <label>Message template</label>
      <textarea id="messageTemplate" rows="4" placeholder="Hi, Marcus doing some testing here."></textarea>
      <label>Profile URLs (one per line)</label>
      <textarea id="urls" rows="8" placeholder="https://www.linkedin.com/in/..."></textarea>
      <div class="row actions">
        <button id="start">Start</button>
        <button id="pause" class="secondary">Pause</button>
        <button id="abort" class="danger">Abort</button>
      </div>
      <div class="row" style="margin-top: 8px">
        <button id="clearCooldown" class="secondary" type="button">Clear cooldown</button>
      </div>
    </section>

    <section class="card">
      <h2>Quota</h2>
      <p id="quota" class="meta">—</p>
      <h2>Status</h2>
      <pre id="status">Idle</pre>
    </section>

    <p class="hint">
      Keep the worker window open (not minimized). Yellow debugger banner is expected.
      Message mode: connected → DM; not connected → auto Connect flow; pending → skip.
    </p>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
